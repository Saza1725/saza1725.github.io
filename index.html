<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Motivation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <!-- Favicon -->
  <link rel="icon" href="data:,">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
</head>

<!-- ✅ HIER ist der Body richtig -->
<body class="intro-active ui-hidden">
<div id="app-bg"></div>


<!-- ================= HEADER / HERO ================= -->
  <header class="hero">


<div id="introOverlay">

  <picture>
    <source 
      srcset="
        assets/images/640.jpg 640w,
        assets/images/1536.jpg 1536w,
        assets/images/1920.jpg 1920w
      "
      sizes="70vw">

    <img
      id="introImage"
      src="assets/images/1536.jpg"
      alt="Intro Bild"
      loading="eager"
      fetchpriority="high"
      decoding="async"
      style="width:100%; height:20%; object-fit:cover;">
  </picture>

  <button id="introStart">
    ▶ Start
  </button>

</div>

    <!-- Uhrzeit & Datum -->
    <div class="time-block">
      <div id="time"></div>
      <div class="date-line">
        <span id="weekday"></span> · <span id="date"></span>
      </div>
    </div>

<!-- ================= FOKUS ORDNER ================= -->
<div id="focusFolders">

  

  <div class="focus-card" data-target="info">
    <h3>Entstehung</h3>
    <p>Worum es hier geht</p>
  </div>


  <div class="focus-card" data-target="about">
    <h3>Über mich</h3>
    <p>Wer ich bin & was mich geprägt hat</p>
  </div>

  <div class="focus-card" data-target="story">
    <h3>Meine Geschichte</h3>
    <p>Kapitel, Gedanken, Entwicklung</p>
  </div>

</div>

    <!-- Tageszitat -->
    <div id="dailyQuoteBox" class="daily-quote"></div>

  </header>


  <!-- ================= MENU BUTTON ================= -->
  <button id="menuButton">☰ Menü</button>

  <!-- ================= NAVIGATION ================= -->
 <nav id="menu">

  <button id="homeBtn" class="menu-home group-a">
    ⌂ Hauptseite
  </button>
  

  <div class="menu-separator"></div>

  <button data-target="thoughts" class="group-c">!!!Hör genau hin!!!</button>
  <button data-target="ordnerX" class="group-c">Ordner X</button>

  <div class="menu-separator"></div>

  <button data-target="quotes" class="group-d">Zitate</button>
  <button data-target="archive" class="group-d">Vergangene Tage</button>

</nav>


  <!-- ================= MAIN CONTENT ================= -->
   <!-- MAIN -->
  <main>
    <section class="card">
      <p>Mein Fokus heute</p>
      <input id="dailyFocusInput" type="text" placeholder="Dein Fokus …">
    </section>

    <div id="dailyTextBox" class="story-text"></div>
    <div id="dailyTextBox"></div>
    

    <!-- Tageszeit Buttons -->
    <div class="buttons">
      <button data-time="morning">🌅 Morgen</button>
      <button data-time="noon">☀️ Mittag</button>
      <button data-time="evening">🌙 Abend</button>
    </div>

    <!-- Persönliche Zitate / Statistik -->
    <div id="personalQuoteDisplay"></div>
    
  </main>



  <!-- ================= OVERLAY ================= -->
  <div id="overlay">
    <div id="overlayContent"></div>
  </div>

  <!-- ================= SCRIPT ================= -->
  <script src="js/app.js" defer></script>
  
<!-- ================= MUSIC PLAYER ================= -->

<audio id="storyMusic" src="assets/audio/nichtseinreden .mp3"></audio>

</body>
</html>
